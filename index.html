<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Click Club POS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Top bar -->
  <nav class="navbar bg-body-tertiary border-bottom sticky-top">
    <div class="container-fluid gap-3">
      <span class="navbar-brand fw-bold mb-0"><i class="bi bi-mouse3 text-danger"></i> Click Club</span>

      <div class="input-group search-box rounded-pill">
        <span class="input-group-text border-0"><i class="bi bi-search"></i></span>
        <input type="text" id="search" class="form-control border-0" placeholder="Search mice by name or code">
      </div>

      <span class="badge rounded-pill text-bg-secondary fs-6 fw-normal">
        <i class="bi bi-bag"></i> <span id="pill-qty">0</span> items
      </span>
    </div>
  </nav>

  <main class="container-fluid py-4">
    <div class="row g-4">

      <!-- LEFT: products -->
      <section class="col-xl-8">
        <h4 class="fw-bold mb-3">Pick a mouse</h4>
        <div id="categories" class="d-flex flex-wrap gap-2 mb-4"></div>
        <div id="product-grid" class="row g-3"></div>
      </section>

      <!-- RIGHT: current order -->
      <aside class="col-xl-4">
        <div class="card cart-sticky">
          <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="mb-0 fw-bold">Current order</h5>
            <button id="clear-btn" class="btn btn-sm btn-outline-danger">
              <i class="bi bi-trash3"></i> Clear
            </button>
          </div>

          <div class="card-body">
            <ul id="order-list" class="list-group list-group-flush order-scroll"></ul>
            <p id="empty-msg" class="text-center text-body-secondary py-4 mb-0">
              No mice in the order yet. Tap a product to add it.
            </p>

            <div class="row g-2 my-3">
              <div class="col-4">
                <label class="form-label small text-body-secondary mb-1">Tax</label>
                <div class="input-group input-group-sm">
                  <input type="number" id="tax" class="form-control" min="0" placeholder="0">
                  <span class="input-group-text">%</span>
                </div>
              </div>
              <div class="col-4">
                <label class="form-label small text-body-secondary mb-1">Discount</label>
                <div class="input-group input-group-sm">
                  <input type="number" id="discount" class="form-control" min="0" placeholder="0">
                  <span class="input-group-text">%</span>
                </div>
              </div>
              <div class="col-4">
                <label class="form-label small text-body-secondary mb-1">Shipping</label>
                <div class="input-group input-group-sm">
                  <input type="number" id="shipping" class="form-control" min="0" placeholder="0">
                  <span class="input-group-text">$</span>
                </div>
              </div>
            </div>

            <div class="border-top pt-3">
              <div class="d-flex justify-content-between text-body-secondary">
                <span>Items</span><span id="total-qty">0</span>
              </div>
              <div class="d-flex justify-content-between text-body-secondary">
                <span>Sub total</span><span>$<span id="subtotal">0.00</span></span>
              </div>
              <div class="d-flex justify-content-between fs-3 fw-bold mt-2">
                <span>Total</span><span class="text-info">$<span id="total">0.00</span></span>
              </div>
            </div>

            <button id="pay-btn" class="btn btn-danger btn-lg w-100 mt-3">
              <i class="bi bi-credit-card"></i> Complete sale
            </button>
          </div>
        </div>
      </aside>

    </div>
  </main>

  <!-- Receipt (plain JS toggles d-none) -->
  <div id="receipt-overlay"
    class="d-none z-top position-fixed top-0 start-0 w-100 h-100 bg-black bg-opacity-75 d-flex align-items-center justify-content-center p-3">
    <div class="card receipt-box w-100">
      <div class="card-body">
        <h5 class="card-title fw-bold">Receipt</h5>
        <p id="receipt-date" class="small text-body-secondary"></p>
        <div id="receipt-items"></div>
        <hr>
        <div class="d-flex justify-content-between fs-4 fw-bold">
          <span>Total</span><span class="text-info">$<span id="receipt-total"></span></span>
        </div>
        <button id="new-order-btn" class="btn btn-success w-100 mt-3">Start new order</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
